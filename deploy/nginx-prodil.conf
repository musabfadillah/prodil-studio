# Nginx Reverse Proxy Configuration for Hostinger VPS
# Place in: /etc/nginx/sites-available/prodil-api
# Enable with: sudo ln -s /etc/nginx/sites-available/prodil-api /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.yourdomain.com YOUR_VPS_IP;

    # Maximum file upload size for PDF/DOCX Smart Import
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for Gemini AI streaming/processing
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
